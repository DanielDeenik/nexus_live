# Checks the Nexus live web before Cloudflare ships it. Cloudflare Workers Builds deploys the
# "nexuslive" Worker itself (cloudflare/apps/web/wrangler.jsonc, setup in cloudflare/docs/cloudflare-web.md),
# so this workflow only proves the change: the full Supabase and web test suite, the type check and the build.
name: nexus-web
on:
  pull_request:
    paths: ["cloudflare/apps/web/**", "cloudflare/supabase/**", ".github/workflows/nexus-web.yml"]
  push:
    branches: [main, feat/supabase-foundation]
    paths: ["cloudflare/apps/web/**", "cloudflare/supabase/**", ".github/workflows/nexus-web.yml"]
  workflow_dispatch:

concurrency:
  group: nexus-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # pnpm-lock.yaml is not committed (cloudflare/.gitignore), so the install resolves fresh.
      - run: pnpm install --no-frozen-lockfile
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Supabase and web tests
        working-directory: cloudflare/supabase
        run: deno test --node-modules-dir=auto --allow-read --allow-env --allow-net --allow-write tests
      - name: Type-check and build
        working-directory: cloudflare/apps/web
        run: pnpm run build
