# Builds the Nexus web app and deploys it to Cloudflare Pages.
# One-time setup in GitHub > Settings > Secrets and variables > Actions:
#   secrets:   CLOUDFLARE_API_TOKEN (Pages: Edit), CLOUDFLARE_ACCOUNT_ID
#   variables: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (publishable key; public by design)
name: nexus-web
on:
  push:
    branches: [main, feat/supabase-foundation]
    paths: ["cloudflare/apps/web/**", "cloudflare/supabase/functions/_shared/fiscal/**", ".github/workflows/nexus-web.yml"]
  workflow_dispatch:

concurrency: { group: nexus-web-${{ github.ref }}, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read, deployments: write }
    defaults: { run: { working-directory: cloudflare } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --no-frozen-lockfile
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Fiscal engine tests
        run: deno test --allow-read supabase/tests/fiscal_test.ts
      - name: Type-check and build
        working-directory: cloudflare/apps/web
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npx tsc --noEmit && npx vite build
      - name: Ensure Pages project exists
        working-directory: cloudflare/apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 pages project create nexus --production-branch main || true
      - name: Deploy
        working-directory: cloudflare/apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 pages deploy dist --project-name nexus --branch main --commit-dirty=true
