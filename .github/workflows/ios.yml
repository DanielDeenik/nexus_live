name: Nexuslive iOS

# The iPhone build runs only when started by hand or when a commit message contains [ios].
# It signs with the App Store Connect API key (same team and key as Ladon) and uploads to TestFlight.
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight
        type: boolean
        default: true

defaults:
  run:
    working-directory: ios

jobs:
  # Proves the App Store Connect key and registers the bundle ID on a cheap Linux runner first.
  asc-key:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load Apple identifiers (not secret)
        run: grep -E '^[A-Z_]+=' Config/release.env >> "$GITHUB_ENV"
      - name: Check the key, then register the bundle ID if Apple does not know it yet
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_P8_BASE64" ]; then echo "::error::Add the secret ASC_KEY_P8_BASE64 to this repo (same value as in Ladon)"; exit 1; fi
          key="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$key"' EXIT
          if printf '%s' "$ASC_KEY_P8_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8_BASE64" > "$key"
          else
            printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' \r\n' | base64 -d > "$key"
          fi
          scripts/check-asc-key.sh "$key" "$ASC_KEY_ID" "$ASC_ISSUER_ID"
          scripts/ensure-bundle-ids.sh "$key" "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$IV_BUNDLE_ID"
          # TestFlight needs an app record for this bundle ID. Apple does not allow creating it by API.
          token=$(scripts/asc-token.sh "$key" "$ASC_KEY_ID" "$ASC_ISSUER_ID")
          found=$(curl -s --globoff -H "Authorization: Bearer $token" \
            "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=$IV_BUNDLE_ID" \
            | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("data", [])))')
          if [ "$found" = "0" ]; then
            echo "::error::No App Store Connect app for $IV_BUNDLE_ID yet. Create it once: App Store Connect, Apps, plus, New App, bundle ID $IV_BUNDLE_ID"; exit 1
          fi
          echo "App Store Connect app found for $IV_BUNDLE_ID"

  ios:
    needs: asc-key
    runs-on: macos-26
    env:
      IV_MARKETING_VERSION: "1.0.0"
      IV_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Load Apple identifiers and backend address (not secret)
        run: grep -E '^[A-Z_]+=' Config/release.env >> "$GITHUB_ENV"
      - name: Select Xcode
        run: |
          # Newest stable Xcode 26 (App Store uploads need the iOS 26 SDK)
          xc="$(ls -d /Applications/Xcode_26*.app | grep -viE 'beta|candidate' | sort -V | tail -1)"
          sudo xcode-select -s "$xc"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write build settings
        run: bash scripts/write-xcconfig.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: App Store Connect key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          key="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_KEY_P8_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8_BASE64" > "$key"
          else
            printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' \r\n' | base64 -D > "$key"
          fi
          grep -q "BEGIN PRIVATE KEY" "$key" || { echo "::error::Decoded key is not a .p8 private key"; exit 1; }
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project Nexuslive.xcodeproj -scheme Nexuslive -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Nexuslive.xcarchive" \
            CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$IV_TEAM_ID" \
            archive 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|BUILD|ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/build.log"
      - name: Export and upload to TestFlight
        if: github.event_name != 'workflow_dispatch' || inputs.upload
        run: |
          sed "s|__TEAM_ID__|$IV_TEAM_ID|" scripts/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Nexuslive.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
