# Supabase CLI project config. `project_id` links this repo to a hosted project
# after `supabase link`. Secrets/keys are never stored here — set them via
# `supabase secrets set` and the dashboard (see SETUP.md).

project_id = "nexus"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Set to your deployed SPA origin in production (Cloudflare Pages URL).
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# OAuth providers — enable and supply client id/secret via the dashboard or env.
[auth.external.google]
enabled = false
client_id = ""
secret = ""

[auth.external.linkedin_oidc]
enabled = false
client_id = ""
secret = ""

[functions.sync-moneybird]
verify_jwt = false

[functions.sync-wise]
verify_jwt = false

[functions.sync-stripe]
verify_jwt = false

[functions.sync-bank]
verify_jwt = false

[functions.run-agents]
verify_jwt = false

[functions.recalc]
verify_jwt = false
